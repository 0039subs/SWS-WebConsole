<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="SWS Web Console - Help & Documentation" />
<meta name="theme-color" content="#0b0b0b" />
<title>SWS Help - Documentation</title>
<style>
:root {
  --bg: #0b0b0b;
  --panel: #111;
  --text: #e6eef8;
  --accent: #2196f3;
  --accent2: #ffc107;
  --success: #9ef0a9;
  --error: #ff9b9b;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  padding: 20px;
  min-height: 100vh;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 40px;
  gap: 20px;
  flex-wrap: wrap;
}

.header h1 {
  font-size: 2em;
  background: linear-gradient(135deg, #2196f3, #21cbf3);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.back-link {
  color: var(--accent);
  text-decoration: none;
  font-size: 0.9em;
  padding: 8px 12px;
  border: 1px solid var(--accent);
  border-radius: 4px;
  transition: all 0.2s;
}

.back-link:hover {
  background: rgba(33, 150, 243, 0.1);
}

.language-switcher {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.lang-btn {
  padding: 8px 12px;
  background: var(--panel);
  color: var(--text);
  border: 1px solid #222;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
}

.lang-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.lang-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.container {
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
}

.toc {
  background: var(--panel);
  border: 1px solid #222;
  padding: 20px;
  border-radius: 8px;
  margin-bottom: 40px;
}

.toc h2 {
  color: var(--accent);
  margin-bottom: 15px;
  font-size: 1.2em;
}

.toc ul {
  list-style: none;
}

.toc li {
  margin: 8px 0;
}

.toc a {
  color: var(--accent);
  text-decoration: none;
  padding: 4px 8px;
  border-radius: 4px;
  transition: background 0.2s;
}

.toc a:hover {
  background: rgba(33, 150, 243, 0.1);
}

.accordion {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.accordion-item {
  background: var(--panel);
  border: 1px solid #222;
  border-radius: 8px;
  overflow: hidden;
  transition: all 0.2s;
}

.accordion-item:hover {
  border-color: rgba(33, 150, 243, 0.3);
}

.accordion-header {
  padding: 16px 20px;
  background: linear-gradient(90deg, rgba(33, 150, 243, 0.05), transparent);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  user-select: none;
  transition: background 0.2s;
}

.accordion-header:hover {
  background: linear-gradient(90deg, rgba(33, 150, 243, 0.1), transparent);
}

.accordion-header h3 {
  color: var(--accent);
  font-size: 1.1em;
  margin: 0;
}

.accordion-toggle {
  font-size: 1.5em;
  color: var(--accent);
  transition: transform 0.2s;
}

.accordion-item.active .accordion-toggle {
  transform: rotate(180deg);
}

.accordion-content {
  padding: 0 20px;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease-out, padding 0.3s ease-out;
}

.accordion-item.active .accordion-content {
  max-height: 2000px;
  padding: 0 20px 20px 20px;
}

.accordion-content p {
  margin-bottom: 12px;
  line-height: 1.6;
}

.accordion-content h4 {
  color: var(--accent2);
  margin-top: 16px;
  margin-bottom: 8px;
}

.code-block {
  background: #0a0a0a;
  border: 1px solid #222;
  padding: 12px;
  border-radius: 4px;
  margin: 12px 0;
  overflow-x: auto;
  font-family: 'Courier New', monospace;
  font-size: 0.85em;
  line-height: 1.5;
  color: #a9d1ff;
}

.code-inline {
  background: #0a0a0a;
  padding: 2px 6px;
  border-radius: 3px;
  font-family: 'Courier New', monospace;
  font-size: 0.9em;
  color: #a9d1ff;
}

.table-wrapper {
  margin: 12px 0;
  overflow-x: auto;
}

.syntax-table {
  width: 100%;
  border-collapse: collapse;
  border: 1px solid #222;
  font-size: 0.9em;
}

.syntax-table thead {
  background: rgba(33, 150, 243, 0.1);
}

.syntax-table th,
.syntax-table td {
  padding: 10px;
  border: 1px solid #222;
  text-align: left;
}

.syntax-table th {
  color: var(--accent);
  font-weight: bold;
}

.syntax-table tr:hover {
  background: rgba(33, 150, 243, 0.05);
}

.note {
  background: rgba(255, 193, 7, 0.1);
  border-left: 4px solid var(--accent2);
  padding: 12px;
  margin: 12px 0;
  border-radius: 4px;
}

.note strong {
  color: var(--accent2);
}

.warning {
  background: rgba(255, 155, 155, 0.1);
  border-left: 4px solid var(--error);
  padding: 12px;
  margin: 12px 0;
  border-radius: 4px;
}

.warning strong {
  color: var(--error);
}

.success {
  background: rgba(158, 240, 169, 0.1);
  border-left: 4px solid var(--success);
  padding: 12px;
  margin: 12px 0;
  border-radius: 4px;
}

.success strong {
  color: var(--success);
}

.list-style {
  margin-left: 20px;
  margin-bottom: 12px;
}

.list-style li {
  margin: 6px 0;
}

.footer {
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid #222;
  color: #9aa;
  font-size: 0.9em;
  text-align: center;
}

@media (max-width: 768px) {
  .header {
    flex-direction: column;
    align-items: flex-start;
  }
  
  .accordion-header h3 {
    font-size: 1em;
  }
  
  .syntax-table {
    font-size: 0.8em;
  }
  
  .syntax-table th,
  .syntax-table td {
    padding: 8px;
  }
}
</style>
</head>

  <a href="index.html" class="back-link" id="back-link">← Back to Home</a>

</div>

// ===== ACCORDION GENERATION =====
function generateAccordion(lang) {
  const content = helpContent[lang];
  const container = document.getElementById('accordion-container');
  container.innerHTML = '';
  
  content.sections.forEach((section, index) => {
    const item = document.createElement('div');
    item.className = 'accordion-item' + (index === 0 ? ' active' : '');
    item.innerHTML = `
      <div class="accordion-header">
        <h3>${section.title}</h3>
        <span class="accordion-toggle">▼</span>
      </div>
      <div class="accordion-content">
        ${section.content}
      </div>
    `;
    
    item.querySelector('.accordion-header').addEventListener('click', () => {
      item.classList.toggle('active');
    });
    
    container.appendChild(item);
  });
}

// ===== LANGUAGE SWITCHING =====
function setLanguage(lang) {
  localStorage.setItem('swsLanguage', lang);
  
  // Update text elements
  document.getElementById('page-title').textContent = helpContent[lang]['page-title'];
  document.getElementById('back-link').textContent = helpContent[lang]['back-link'];
  document.querySelector('.toc h2').textContent = helpContent[lang]['toc-title'];
  
  document.getElementById('toc-started').textContent = helpContent[lang]['toc-started'];
  document.getElementById('toc-syntax').textContent = helpContent[lang]['toc-syntax'];
  document.getElementById('toc-commands').textContent = helpContent[lang]['toc-commands'];
  document.getElementById('toc-instruments').textContent = helpContent[lang]['toc-instruments'];
  document.getElementById('toc-advanced').textContent = helpContent[lang]['toc-advanced'];
  document.getElementById('toc-examples').textContent = helpContent[lang]['toc-examples'];
  document.getElementById('toc-faq').textContent = helpContent[lang]['toc-faq'];
  
  document.getElementById('footer').textContent = '© 2024 SWS Web Console | Version 0.2.0';
  
  // Update active button
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  document.querySelector(`[data-lang="${lang}"]`).classList.add('active');
  
  // Generate accordion
  generateAccordion(lang);
  
  // Update HTML lang
  document.documentElement.lang = lang;
}

// ===== LANGUAGE BUTTONS =====
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const lang = btn.getAttribute('data-lang');
    setLanguage(lang);
  });
});

// ===== INITIALIZATION =====
window.addEventListener('load', () => {
  let savedLang = localStorage.getItem('swsLanguage');
  
  if (!savedLang) {
    const browserLang = navigator.language || navigator.userLanguage;
    
    if (browserLang.startsWith('ja')) {
      savedLang = 'ja';
    } else if (browserLang.startsWith('de')) {
      savedLang = 'de';
    } else if (browserLang.startsWith('en-GB') || browserLang === 'en-GB') {
      savedLang = 'en-GB';
    } else if (browserLang.startsWith('en')) {
      savedLang = 'en-US';
    } else {
      savedLang = 'en-US';
    }
  }
  
  setLanguage(savedLang);
});
</script>
