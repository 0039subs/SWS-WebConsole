name: Validate SWS Files

on:
  push:
    paths:
      - '*.ss'
      - '*.ust'
  pull_request:
    paths:
      - '*.ss'
      - '*.ust'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install chardet

      - name: Validate .ss files
        run: |
          for file in $(find . -name "*.ss" -type f); do
            echo "Validating $file..."
            python -c "
            import re
            with open('$file', 'r', encoding='utf-8') as f:
              content = f.read()
              if 'snd(' in content or 'sleep(' in content or 'tempoconst' in content:
                print(f'  ✓ Valid SWS syntax in $file')
              else:
                print(f'  ⚠ No SWS statements found in $file')
            " || true
          done
        continue-on-error: true

      - name: Validate .ust files
        run: |
          for file in $(find . -name "*.ust" -type f); do
            echo "Validating $file..."
            python -c "
            with open('$file', 'r', encoding='utf-8', errors='replace') as f:
              content = f.read()
              if '[#VERSION]' in content and '[#SETTING]' in content:
                print(f'  ✓ Valid UST format in $file')
              else:
                print(f'  ⚠ Invalid UST format in $file')
            " || true
          done
        continue-on-error: true

      - name: Check file encoding
        run: |
          for file in $(find . \( -name "*.ss" -o -name "*.ust" \) -type f); do
            echo "Checking encoding of $file..."
            file "$file" || true
          done