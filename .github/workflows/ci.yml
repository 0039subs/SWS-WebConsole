name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
        node-version: [16.x, 18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies (if requirements.txt exists)
        if: exists('requirements.txt')
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python linter (flake8) if installed
        run: |
          if python -c "import importlib,sys; importlib.util.find_spec('flake8') is None" ; then
            echo "flake8 not installed, skipping lint"
          else
            flake8 || true
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install frontend dependencies (if package.json exists)
        if: exists('package.json')
        run: |
          npm ci || npm install

      - name: Run frontend lint/test scripts (if defined)
        if: exists('package.json')
        run: |
          if jq -r '.scripts.test // empty' package.json | grep -q '.'; then
            npm test || true
          else
            echo "No test script defined"
          fi

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            ${{ github.workspace }}
