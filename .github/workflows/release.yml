name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          release_name: SWS Release ${{ steps.tag.outputs.version }}
          body: |
            # Sound Wav Script Release ${{ steps.tag.outputs.version }}

            ## What's New
            - Check the commit history for changes

            ## Downloads
            - Web Console: Available at GitHub Pages
            - Python: SOUND-WAV-SCRIPT.py

            ## Installation

            ### Web Version
            Visit: https://[your-username].github.io/[repo-name]/

            ### Python Version
            ```bash
            python SOUND-WAV-SCRIPT.py
            ```

            ## Documentation
            See README.md for usage instructions.
          draft: false
          prerelease: false

  build-assets:
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create web bundle
        run: |
          mkdir -p dist
          cp index.html dist/
          cp style.css dist/ 2>/dev/null || true
          cp sws-core.js dist/
          cp ui-controller.js dist/
          cp README.md dist/
          cd dist && zip -r sws-web-console.zip . && cd ..

      - name: Create Python bundle
        run: |
          cp SOUND-WAV-SCRIPT.py dist/
          cd dist && zip sws-python.zip SOUND-WAV-SCRIPT.py && cd ..

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/sws-web-console.zip
            dist/sws-python.zip
            SOUND-WAV-SCRIPT.py
          draft: false
