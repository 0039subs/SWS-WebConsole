name: SWS Python Tests

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'SOUND-WAV-SCRIPT.py'
      - 'tests/**'
      - '.github/workflows/sws-py-test.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'SOUND-WAV-SCRIPT.py'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chardet

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 SOUND-WAV-SCRIPT.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 SOUND-WAV-SCRIPT.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Check syntax
        run: python -m py_compile SOUND-WAV-SCRIPT.py

      - name: Run basic import test
        run: python -c "import sys; sys.path.insert(0, '.'); exec(open('SOUND-WAV-SCRIPT.py').read())" || true

  security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install bandit

      - name: Run Bandit security scan
        run: bandit -r . -ll -x ./tests || true
        continue-on-error: true

  compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test import on ${{ matrix.os }}
        run: python -c "print('Python import test passed')"
